<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Inspirado no Exemplo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
        }


        .cabecalho-principal {
            background-color: #3f51b5; /* Uma cor azul para diferenciar */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
        }


        .cabecalho-principal .icone-menu-lado {
            font-size: 1.5em;
            cursor: pointer;
        }


        .cabecalho-principal .titulo-site {
            font-weight: bold;
            font-size: 1.2em;
        }


        .cabecalho-principal .icone-pesquisa-lado {
            font-size: 1.2em;
            cursor: pointer;
        }


        .secao-conteudo-simulada {
            padding: 50px;
            text-align: center;
        }


        .secao-conteudo-simulada h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }


        .secao-conteudo-simulada p {
            color: #666;
        }
    </style>
</head>
<body>


    <header class="cabecalho-principal">
        <div class="icone-menu-lado">&#9776;</div> <!-- Ícone simples de hambúrguer -->
        <div class="titulo-site">Menu Web Carlos</div> <!-- Título mudado -->
        <div class="icone-pesquisa-lado">&#128269;</div> <!-- Ícone simples de lupa -->
    </header>


    <div class="secao-conteudo-simulada">
        <h1>Fazendo layouts com Flexbox</h1>
        <p>Este é um exemplo simples de como centralizar itens em uma barra de topo.</p>
    </div>


</body>
</html>
