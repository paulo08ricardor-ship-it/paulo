<!DOCTYPE html>
<html lang="pt-BR">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na Conta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    body {
      background-color: #a78bfa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }


    .container {
      display: flex;
      width: 850px;
      max-width: 90%;
      min-height: 500px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }


    /* Lado Esquerdo - Painel Roxo */
    .banner {
      flex: 1;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }


    .banner h2 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }


    .banner p {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.9;
    }


    /* Lado Direito - Formulário */
    .login-section {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #ffffff;
    }


    .login-section h2 {
      font-size: 1.8rem;
      color: #333333;
      margin-bottom: 25px;
    }


    .form-group {
      margin-bottom: 15px;
    }


    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 25px;
      background-color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }


    .input-field:focus {
      border-color: #7c3aed;
    }


    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 25px;
    }


    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }


    .forgot-pass {
      color: #64748b;
      text-decoration: none;
    }


    .forgot-pass:hover {
      text-decoration: underline;
    }


    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background-color: #6d28d9;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }


    .btn-submit:hover {
      background-color: #5b21b6;
    }


    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
    }


    .register-link a {
      color: #6d28d9;
      text-decoration: none;
      font-weight: 600;
    }


    .register-link a:hover {
      text-decoration: underline;
    }


    /* Responsividade para telas menores */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }


      .banner {
        padding: 30px;
        text-align: center;
      }
    }
  </style>
</head>


<body>


  <div class="container">
    <!-- Lado Esquerdo -->
    <div class="banner">
      <h2>Bem-vindo de volta!</h2>
      <p>Você pode entrar para acessar sua conta existente.</p>
    </div>


    <!-- Lado Direito -->
    <div class="login-section">
      <h2>Entrar</h2>
      <form action="#">
        <div class="form-group">
          <input type="text" class="input-field" placeholder="Nome de usuário ou e-mail" required>
        </div>
        <div class="form-group">
          <input type="password" class="input-field" placeholder="Senha" required>
        </div>


        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Lembrar de mim
          </label>
          <a href="#" class="forgot-pass">Esqueceu a senha?</a>
        </div>


        <button type="submit" class="btn-submit">Entrar</button>


        <p class="register-link">
          Novo por aqui? <a href="#">Criar uma conta</a>
        </p>
      </form>
    </div>
  </div>


</body>


</html>
